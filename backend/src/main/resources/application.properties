spring.application.name=library-management
server.port=${PORT:8080}

# Cho phép ứng dụng hoàn tất request đang xử lý trước khi dừng.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


spring.jpa.open-in-view=false


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


security.jwt.secret=${JWT_SECRET:dGVzdF9qd3Rfc2VjcmV0X2tleV9mb3JfbG9jYWxfZGV2ZWxvcG1lbnRfb25seV8xMjM0NTY3ODkw}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# giới hạn môi trường đang ở local/dev để chạy dataseeder
spring.profiles.active=local