spring.application.name=library-management
server.port=${PORT:8080}

# Cho phép ứng dụng hoàn tất request đang xử lý trước khi dừng.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
#Đẩy đường dẫn ra file
app.upload.dir=uploads/ 
spring.jpa.open-in-view=false


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
# giới hạn môi trường đang ở local/dev để chạy dataseeder
spring.profiles.active=local

# Cloudflare R2 Storage Test Configuration
cloud.r2.endpoint=${R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
cloud.r2.access-key=${R2_ACCESS_KEY:dummy-access-key}
cloud.r2.secret-key=${R2_SECRET_KEY:dummy-secret-key}
cloud.r2.bucket-name=${R2_BUCKET_NAME:test-bucket}
cloud.r2.public-url=${R2_PUBLIC_URL:https://pub-test.r2.dev}
