<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Thư Viện</title>
    <!-- Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800">Quản Lý Thư Viện</h1>
        <p class="text-sm text-slate-500 mt-1">Thủ thư đăng nhập để tiếp tục</p>
    </div>

    <!-- Alert thông báo lỗi tổng -->
    <div id="errorAlert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm text-center"></div>

    <!-- Form đăng nhập (Đã bỏ onsubmit trực tiếp) -->
    <form id="loginForm" class="space-y-4">
        <!-- Tên đăng nhập -->
        <div>
            <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Tên đăng nhập</label>
            <input
                    type="text"
                    id="username"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Nhập tên tài khoản"
            />
            <span id="usernameError" class="text-xs text-red-500 hidden">Vui lòng nhập tên đăng nhập</span>
        </div>

        <!-- Mật khẩu -->
        <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
            <input
                    type="password"
                    id="password"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="••••••••"
            />
            <span id="passwordError" class="text-xs text-red-500 hidden">Vui lòng nhập mật khẩu</span>
        </div>

        <!-- Nút Đăng nhập -->
        <button
                type="submit"
                id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200"
        >
            Đăng nhập
        </button>
    </form>
</div>

<!-- Nhúng file JS xử lý logic riêng biệt (sử dụng defer để đợi DOM render xong) -->
<script src="JS/Auth.js" defer></script>
</body>
</html>
