<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/globals.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-[#f8f6f0]">
<div class="w-full max-w-md p-8 bg-white rounded-xl shadow-md border border-gray-100">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-[#0f4c28]">Library Management</h1>
        <p class="text-sm text-gray-500 mt-1">Login to the system</p>
    </div>

    <!-- Thông báo lỗi (ẩn mặc định) -->
    <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center"></div>

    <!-- Bỏ onsubmit inline cũ, gắn ID loginForm -->
    <form id="loginForm" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Account</label>
            <input type="text" id="username" required placeholder="admin" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#0f4c28] outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="password" required placeholder="" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#0f4c28] outline-none">
        </div>

        <button type="submit" class="w-full py-2.5 bg-[#0f4c28] text-white font-medium rounded-lg hover:bg-emerald-900 transition-colors">
            Login
        </button>
    </form>
    <script src="JS/Auth.js" defer></script>
</div>
</body>
</html>
