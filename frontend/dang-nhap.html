<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý Thư viện</title>
    <!-- CSS & Tailwind -->
    <link rel="stylesheet" href="css/globals.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f6f0] flex items-center justify-center min-h-screen">
<script>
    const token = localStorage.getItem('accessToken');
    if (token) {
        window.location.replace('index.html');
    }
</script>

<div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-md">
    <div class="text-center">
        <h1 class="text-2xl font-bold text-[#0f4c28]">Quản Lý Thư Viện</h1>
        <p class="text-sm text-gray-600 mt-1">Đăng nhập để truy cập hệ thống</p>
    </div>

    <!-- Thông báo lỗi tổng quát -->
    <div id="errorAlert" class="hidden p-3 text-sm text-red-700 bg-red-100 rounded-lg text-center"></div>

    <form id="loginForm" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>
            <input type="text" id="username" class="w-full px-4 py-2 mt-1 border rounded-lg focus:ring-2 focus:ring-[#0f4c28] focus:outline-none" placeholder="Nhập tên đăng nhập">
            <span id="usernameError" class="hidden text-xs text-red-500 mt-1">Vui lòng nhập tên đăng nhập!</span>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
            <input type="password" id="password" class="w-full px-4 py-2 mt-1 border rounded-lg focus:ring-2 focus:ring-[#0f4c28] focus:outline-none" placeholder="Nhập mật khẩu">
            <span id="passwordError" class="hidden text-xs text-red-500 mt-1">Vui lòng nhập mật khẩu!</span>
        </div>

        <button type="submit" class="w-full py-2.5 bg-[#0f4c28] text-white font-medium rounded-lg hover:bg-[#0b381d] transition-colors">
            Đăng nhập
        </button>
    </form>
</div>
</body>
</html>
