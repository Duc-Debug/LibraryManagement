name: Backend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  backend:
    name: Build Backend

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Build & Verify
        run: ./mvnw clean verify