name: Frontend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  frontend:
    name: Build Frontend

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build